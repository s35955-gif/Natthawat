<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติส่วนตัว</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    text-align:center;
    padding:50px;
}

.card{
    background:white;
    width:400px;
    margin:auto;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

img{
    width:150px;
    border-radius:50%;
}

h1{
    color:#333;
}

p{
    color:#666;
}
</style>

</head>
<body>

<div class="card">
    <img src="https://via.placeholder.com/150" alt="Profile">
    <h1>ทัช</h1>
    <p>นักเรียน</p>
    <p>ชอบฟุตบอล ⚽</p>
    <p>ชอบออกแบบโปสเตอร์ดิจิทัล 🎨</p>
</div>

</body>
</html>
